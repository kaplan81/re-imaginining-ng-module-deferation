<nav class="cat-pager" aria-label="Catalog pagination">
  <p class="cat-pager__summary">
    Showing <strong>{{ rangeStart() }}–{{ rangeEnd() }}</strong> of
    <strong>{{ total() | number }}</strong> lots
  </p>

  <div class="cat-pager__controls">
    <label class="cat-pager__page-size">
      <span>Per page</span>
      <select [value]="pageSize()" (change)="onPageSizeChange($event)">
        @for (size of pageSizeOptions; track size) {
          <option [value]="size">{{ size }}</option>
        }
      </select>
    </label>

    <button type="button" class="cat-pager__button" [disabled]="!canGoPrev()" (click)="onPrev()">
      ← Previous
    </button>

    <span class="cat-pager__indicator">Page {{ page() }} / {{ totalPages() }}</span>

    <button type="button" class="cat-pager__button" [disabled]="!canGoNext()" (click)="onNext()">
      Next →
    </button>
  </div>
</nav>
